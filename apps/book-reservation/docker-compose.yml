# book-reservation app stack. Independent from the core stack; only shares
# the traefik-public network. Deploy after the core stack is up:
#
#   docker compose -f apps/book-reservation/docker-compose.yml up -d
#
# First run only, apply migrations and create an admin user (see README.md
# in the app's own repo for details):
#
#   docker compose -f apps/book-reservation/docker-compose.yml run --rm web python manage.py migrate
#   docker compose -f apps/book-reservation/docker-compose.yml run --rm -it web python manage.py createsuperuser

networks:
  traefik-public:
    external: true

volumes:
  book-reservation-data:

services:
  web:
    image: ${BOOK_RESERVATION_IMAGE:-ghcr.io/vladimirvaca/book_reservation:latest}
    container_name: book-reservation
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${BOOK_RESERVATION_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "books.${DOMAIN},127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://books.${DOMAIN}"
      DJANGO_DB_PATH: /data/db.sqlite3
      DJANGO_MEDIA_ROOT: /data/media
    volumes:
      - book-reservation-data:/data
    networks:
      - traefik-public
    security_opt:
      - no-new-privileges:true
    # Uses the app's own /healthz endpoint (hence 127.0.0.1 in
    # DJANGO_ALLOWED_HOSTS above). python3 is guaranteed present in a Django
    # image; curl/wget often aren't. start_period covers gunicorn boot.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.books.rule=Host(`books.${DOMAIN}`)"
      - "traefik.http.routers.books.entrypoints=websecure"
      - "traefik.http.routers.books.tls.certresolver=letsencrypt"
      - "traefik.http.routers.books.middlewares=compress@file,secure-headers@file,rate-limit@file"
      - "traefik.http.services.books.loadbalancer.server.port=8000"
      # Opt this container into Watchtower's label-scoped auto-update.
      # The namespace is `centurylinklabs` (Watchtower's original authors) —
      # a typo here is silent: with WATCHTOWER_LABEL_ENABLE=true the container
      # simply never matches and never updates.
      - "com.centurylinklabs.watchtower.enable=true"
    # Contain this app's footprint so it can't OOM the shared host. Fits
    # gunicorn's 2 preload workers with headroom; raise if you bump workers
    # to 4 on a larger instance. Host swap (README prerequisites) is the backstop.
    deploy:
      resources:
        limits:
          memory: 320M
