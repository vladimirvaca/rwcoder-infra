# Catches the class of mistake this repo is most exposed to: a compose file or
# middleware YAML that only fails when you're SSH'd into production trying to
# deploy. Everything here runs without a host, a domain, or any secret.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compose:
    name: compose files parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `docker compose config` interpolates ${VAR} against the .env next to
      # the file. Without one, unset vars expand to empty and real errors hide
      # behind warnings — so seed each stack from its committed example.
      - name: Seed .env files from examples
        run: |
          cp .env.example .env
          for example in apps/*/.env.example; do
            cp "$example" "$(dirname "$example")/.env"
          done

      - name: Validate core stack
        run: docker compose config --quiet

      - name: Validate every app stack
        run: |
          status=0
          for f in apps/*/docker-compose.yml; do
            echo "==> $f"
            docker compose -f "$f" config --quiet || status=1
          done
          exit $status

      # The Watchtower opt-in label is namespaced `com.centurylinklabs.*`.
      # A typo (e.g. `com.centurylabs.*`) is completely silent: the container
      # just never matches WATCHTOWER_LABEL_ENABLE and never auto-updates.
      # This repo shipped exactly that bug, so it gets a regression test.
      - name: Check Watchtower labels are well-formed
        run: |
          if grep -rn 'watchtower\.enable' apps/ docker-compose.yml \
               | grep -v 'com\.centurylinklabs\.watchtower\.enable'; then
            echo "::error::Watchtower label must be com.centurylinklabs.watchtower.enable"
            exit 1
          fi
          echo "All Watchtower labels use the correct namespace."

  yaml:
    name: traefik dynamic config parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse dynamic middleware YAML
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          failed = False
          for p in pathlib.Path("traefik/dynamic").rglob("*.yml"):
              try:
                  yaml.safe_load(p.read_text())
                  print(f"ok   {p}")
              except yaml.YAMLError as e:
                  print(f"FAIL {p}: {e}", file=sys.stderr)
                  failed = True
          sys.exit(1 if failed else 0)
          PY

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint scripts
        run: shellcheck scripts/*.sh

      - name: Scripts are executable
        run: |
          status=0
          for f in scripts/*.sh; do
            if [ ! -x "$f" ]; then
              echo "::error file=$f::not executable — run: git update-index --chmod=+x $f"
              status=1
            fi
          done
          exit $status
